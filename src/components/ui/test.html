<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero Section</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  // Tailwind v4-style tokens didefinisikan lewat CSS var di bawah (theme() v4),
  // supaya kelas yang dipakai tetap kompatibel kalau file ini nanti
  // dipindah ke project Tailwind v4 (via @tailwindcss/vite / postcss).
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
  html { font-family: 'Inter', system-ui, sans-serif; }

  /* efek "blur/fade" dengan batas melengkung ala quarter-circle (sempit di atas, lebar di bawah) */
  .hero-img-fade {
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><defs><filter id='f' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='2.5'/></filter></defs><path d='M7,0 C7,40 12,70 30,100 L100,100 L100,0 Z' fill='white' filter='url(%23f)'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><defs><filter id='f' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='2.5'/></filter></defs><path d='M7,0 C7,40 12,70 30,100 L100,100 L100,0 Z' fill='white' filter='url(%23f)'/></svg>");
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
  .hero-img-fade::before {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(24px);
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><defs><filter id='f2' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='2.5'/></filter></defs><path d='M7,0 C7,40 12,70 30,100 L0,100 L0,0 Z' fill='white' filter='url(%23f2)'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><defs><filter id='f2' x='-30%' y='-30%' width='160%' height='160%'><feGaussianBlur stdDeviation='2.5'/></filter></defs><path d='M7,0 C7,40 12,70 30,100 L0,100 L0,0 Z' fill='white' filter='url(%23f2)'/></svg>");
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }
</style>
</head>
<body class="bg-white">

  <section class="relative w-full overflow-hidden">
    <div class="mx-auto max-w-7xl flex flex-col lg:flex-row items-stretch min-h-[560px]">

      <!-- Kiri: teks -->
      <div class="relative z-10 w-full lg:w-[42%] flex flex-col justify-between gap-10 px-6 sm:px-10 py-12 lg:py-16">
        <div class="space-y-6">
          <h1 class="text-4xl sm:text-5xl font-light leading-[1.1] text-neutral-900">
            Designing<br />
            Spaces for<br />
            a Better Life
          </h1>
          <p class="text-neutral-500 text-base max-w-xs leading-relaxed">
            Kami merancang ruang yang fungsional, estetis,
            dan berkelanjutan untuk kehidupan yang lebih baik.
          </p>
          <div class="flex flex-wrap gap-3 pt-2">
            <button class="inline-flex items-center gap-2 bg-neutral-900 text-white text-sm font-medium px-6 py-3 rounded-full hover:bg-neutral-800 transition-colors">
              Lihat Portofolio <span aria-hidden="true">→</span>
            </button>
            <button class="inline-flex items-center gap-2 border border-neutral-300 text-neutral-900 text-sm font-medium px-6 py-3 rounded-full hover:bg-neutral-50 transition-colors">
              Konsultasi Gratis
            </button>
          </div>
        </div>

        <!-- Fitur bawah -->
        <div class="grid grid-cols-3 gap-4">
          <div class="flex flex-col gap-2">
            <svg class="w-5 h-5 text-neutral-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11.5 12 4l9 7.5M5 10v9a1 1 0 0 0 1 1h5v-6h2v6h5a1 1 0 0 0 1-1v-9"/></svg>
            <p class="text-sm leading-snug text-neutral-800">
              Arsitektur<br /><span class="text-neutral-400">Fungsional &amp; Estetis</span>
            </p>
          </div>
          <div class="flex flex-col gap-2">
            <svg class="w-5 h-5 text-neutral-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 4c-7 0-13 4-13 12 0 1.5.3 3 .9 4M20 4c0 7-4 13-12 13-1.5 0-3-.3-4-.9"/></svg>
            <p class="text-sm leading-snug text-neutral-800">
              Ramah Lingkungan<br /><span class="text-neutral-400">Desain Berkelanjutan</span>
            </p>
          </div>
          <div class="flex flex-col gap-2">
            <svg class="w-5 h-5 text-neutral-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path stroke-linecap="round" d="M2 20c0-3 2.5-5 6-5s6 2 6 5M13 20c0-2.5 2-4.5 5-4.5s5 2 5 4.5"/></svg>
            <p class="text-sm leading-snug text-neutral-800">
              Dari Konsep<br /><span class="text-neutral-400">hingga Realisasi</span>
            </p>
          </div>
        </div>
      </div>

      <!-- Kanan: gambar dengan fade/blur di sisi kiri -->
      <div class="relative w-full lg:w-[58%] min-h-[320px] lg:min-h-0">
        <div class="hero-img-fade absolute inset-0">
          <img
            src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1600&auto=format&fit=crop"
            alt="Rumah modern minimalis"
            class="w-full h-full object-cover"
          />
        </div>

        <!-- caption kanan bawah -->
        <div class="absolute bottom-6 right-6 flex items-center gap-3 text-white/90">
          <span class="h-px w-10 bg-white/70"></span>
          <p class="text-xs sm:text-sm leading-tight text-right">
            Good Architecture<br />Builds a Better Tomorrow
          </p>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
